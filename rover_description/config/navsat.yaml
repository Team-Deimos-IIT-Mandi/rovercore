navsat_transform_node:
  ros__parameters:
    use_sim_time: true                     # Must be true for Gazebo simulation
    frequency: 10.0
    
    # 0.0 for Gazebo simulation. (For the real ARC in Turkey, change to 0.096)
    magnetic_declination_radians: 0.0      
    yaw_offset: 0.0                        
    broadcast_cartesian_transform: false   
    wait_for_datum: false                  
    
    # Use the fused heading from ekf_local, not just the raw IMU
    use_odometry_yaw: true                
    zero_altitude: true                    
    
    # Turned on so you can visualize the GPS path in RViz
    publish_filtered_gps: true
