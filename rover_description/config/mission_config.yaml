---
# mission_config.yaml — all tunable mission parameters
# Operators: adjust here only. Never hardcode these in scripts.

mission:
  # --- Waypoint navigation ---
  waypoint_acceptance_radius: 2.0     # metres — declare waypoint reached within this distance
  waypoint_approach_speed: 0.5        # m/s max during final approach to waypoint
  waypoint_cruise_speed: 1.0          # m/s max during open-field transit
  nav_goal_timeout: 120.0             # seconds before NavigateToPose is aborted + retried

  # --- GPS / ArUco handoff ---
  aruco_detection_range: 5.0          # metres — begin ArUco search when this close to GPS goal
  aruco_goal_offset: 0.3              # metres — stop this far short of detected marker
  aruco_lost_timeout: 10.0            # seconds — resume GPS nav if marker not re-detected

  # --- Spiral search ---
  spiral_max_radius: 30.0             # metres
  spiral_step: 1.5                    # metres between spiral arms
  spiral_speed: 0.4                   # m/s during spiral

  # --- Gate detection ---
  gate_pole_cluster_radius: 0.3       # metres — DBSCAN eps for pole clustering
  gate_min_width: 0.8                 # metres — ignore gates narrower than this
  gate_max_width: 4.0                 # metres — ignore gaps wider than this
  gate_approach_offset: 0.5           # metres past midpoint to aim through gate

  # --- Slope / E-STOP thresholds ---
  tilt_warning_deg: 15.0              # degrees — publish /terrain/tilt_warning
  estop_roll_deg: 30.0                # degrees — pull GPIO 12 LOW
  estop_pitch_deg: 35.0               # degrees — pull GPIO 12 LOW

  # --- Watchdog ---
  watchdog_timeout: 2.0               # seconds of /rosout silence before E-STOP
  watchdog_gpio_pin: 12               # must match hardware_params.yaml gpio_estop_relay

  # --- Arm pick-place ---
  arm_enabled: false                  # set true when arm is mounted and calibrated
  pregrasp_height: 0.15               # metres above object for pre-grasp approach
  grasp_force_threshold: 5.0          # N — gripper stops closing at this force (⚠️ TBD: measure)
  place_height: 0.05                  # metres above drop zone surface

  # --- Science mission ---
  drill_duration: 5.0                 # seconds of drill operation
  drill_retract_delay: 2.0            # seconds after drilling before sensor reads
  sensor_read_timeout: 3.0            # seconds per science sensor before marking failed
  spectrometer_integration_time: 3.0  # seconds
  science_site_dwell: 10.0            # seconds at site before logging complete

  # --- Comms / telemetry ---
  telemetry_rate: 10.0                # Hz — operator dashboard update rate
  comms_timeout_warn: 5.0             # seconds without operator ping → warn
  comms_timeout_estop: 30.0           # seconds without operator ping → E-STOP (competition rule)
