# combined_controllers.yaml
# Merged controller_manager configuration for the rover+arm combined system.
# Covers: diff_drive_controller (rover wheels) + arm_controller + gripper_controller (arm).
# Use with rover_with_arm.urdf.xacro and a combined launch file.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — matches arm requirement; rover diff_drive runs fine at 100 Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ---------------------------------------------------------------------------
# Rover differential drive controller
# (parameters from src/rover_description/config/rover_controllers.yaml)
# ---------------------------------------------------------------------------
diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["LF_joint", "LB_joint"]
    right_wheel_names: ["RF_joint", "RB_joint"]
    wheel_separation: 0.5874
    wheel_radius: 0.11
    use_stamped_vel: true
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

# ---------------------------------------------------------------------------
# Arm joint trajectory controller
# (parameters from src/my_robotic_arm/config/my_controllers.yaml)
# ---------------------------------------------------------------------------
arm_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false

    # --- V2CLAW HARDWARE TUNING APPLIED HERE ---
    allow_partial_joints_goal: false
    goal_time_tolerance: 1.0       # 1 second extra grace period for physical lag
    state_publish_rate: 50.0       # Hz
    action_monitor_rate: 20.0      # Hz
    interpolation_method: spline   # Smooth velocity profiles

    constraints:
      stopped_velocity_tolerance: 0.05  # rad/s — considered "stopped"
      Joint_1: { goal: 0.05 }
      Joint_2: { goal: 0.05 }
      Joint_3: { goal: 0.05 }
      Joint_4: { goal: 0.05 }
      Joint_5: { goal: 0.05 }
      Joint_6: { goal: 0.05 }

# ---------------------------------------------------------------------------
# Gripper joint trajectory controller
# (parameters from src/my_robotic_arm/config/my_controllers.yaml)
# ---------------------------------------------------------------------------
gripper_controller:
  ros__parameters:
    joints:
      - Finger_1
      - Finger_2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: false
