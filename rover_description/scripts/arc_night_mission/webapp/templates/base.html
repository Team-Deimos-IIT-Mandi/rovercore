<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MISSION CONTROL{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&family=Ubuntu:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark px-3 py-0">
        <span class="navbar-brand">&#9632; {{ mission_name }}  &middot;  MISSION CONTROL</span>
        <div class="d-flex align-items-center gap-3">
            <a href="/about" class="nav-about-link">About</a>
            <span class="text-secondary small" id="clock-display"></span>
        </div>
    </nav>

    <div class="container-fluid px-3 py-2">
        {% block content %}{% endblock %}
    </div>

    {% block modals %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateClock() {
            document.getElementById('clock-display').textContent = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
    {% block page_scripts %}{% endblock %}
</body>
</html>
