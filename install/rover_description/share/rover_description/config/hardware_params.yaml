---
# hardware_params.yaml — single source of truth for all hardware addresses
# Update any value here; all launch files and nodes read from this file.

hardware:
  # --- CAN-FD Bus ---
  can_interface: "can0"
  can_bitrate: 5000000  # 5 Mbit/s

  # Drive motor CAN IDs (AK80-9, cyclic 1 ms CMD)
  can_drive_fl: 0x01
  can_drive_rl: 0x02
  can_drive_fr: 0x03
  can_drive_rr: 0x04

  # Steer motor CAN IDs (moteus r4.11)
  can_steer_fl: 0x11
  can_steer_rl: 0x12
  can_steer_fr: 0x13
  can_steer_rr: 0x14

  # --- GPIO (Jetson Orin NX) ---
  gpio_estop_relay: 12       # Active LOW — pull LOW to cut drive+arm 6S rail
  gpio_science_enable: 16    # Active HIGH — science rail power
  gpio_drone_charge: 20      # Active HIGH — drone trickle charge (operator-gated)
  gpio_rc_sbus_input: 33     # RC receiver SBUS hardware override input

  gpio_imu_primary_cs: 24    # ICM-20948 SPI CS
  gpio_imu_primary_drdy: 25  # ICM-20948 DRDY interrupt (active LOW)
  gpio_imu_secondary_int: 26 # BNO085 INT (active LOW)
  gpio_gps_pps: 18           # GPS PPS → chrony
  gpio_optflow_redundant_cs: 27   # PMW3901 SPI CS
  gpio_optflow_redundant_mot: 28  # PMW3901 motion detect
  gpio_ina3221_drive_alert: 29
  gpio_ina3221_compute_alert: 30
  gpio_bms_fault: 31

  # --- Serial Ports (Jetson Orin NX) ---
  uart_gps_primary: "/dev/ttyTHS0"       # Radiolink M10N, 115200, UBX
  uart_gps_secondary: "/dev/ttyTHS1"     # u-blox SAM-M10Q, 9600, NMEA
  uart_optflow: "/dev/ttyTHS2"           # MicoAir MTF-01, 115200
  uart_sik_radio: "/dev/ttyTHS3"         # SiK 915 MHz, 57600
  uart_lidar: "/dev/ttyUSB0"             # RPLIDAR A2M8, 115200

  # --- Serial Ports (Raspberry Pi 5 — Arm) ---
  uart_arm_stm32: "/dev/ttyAMA0"         # STM32 F407, 115200 8N1
  arm_uart_baud: 115200

  # --- I2C Addresses (Jetson) ---
  i2c_imu_secondary: 0x4A    # BNO085
  i2c_ina3221_drive: 0x40
  i2c_ina3221_compute: 0x41
  i2c_bms: 0x42

  # --- I2C Addresses (Science CM4) ---
  i2c_moisture: 0x28
  i2c_ph: 0x36
  i2c_temperature: 0x40

  # --- MAVROS / Drone ---
  mavlink_udp_host: "192.168.2.1"
  mavlink_udp_port: 14550
  mavros_heartbeat_timeout: 2.0  # seconds

  # --- Rover Geometry ---
  wheel_separation: 0.62   # metres, centre-to-centre left-right
  wheel_radius: 0.14        # metres
