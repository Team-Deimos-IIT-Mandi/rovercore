controller_manager:
  ros__parameters:
    update_rate: 50

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["LF_joint", "LB_joint"]
    right_wheel_names: ["RF_joint", "RB_joint"]

    wheel_separation: 0.5874   # MEASURE: left-to-right wheel centre distance (m)
    wheel_radius: 0.11       # MEASURE: actual wheel radius (m)

    use_stamped_vel: false
    publish_rate: 50.0

    open_loop: false
    position_feedback: true

    enable_odom_tf: false
    base_frame_id: base_link
    odom_frame_id: odom
