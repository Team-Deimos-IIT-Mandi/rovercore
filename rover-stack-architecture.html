<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARS ROVER — SOFTWARE ARCHITECTURE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020609;
  --bg-card: rgba(6,12,24,0.88);
  --border-dim: rgba(255,255,255,0.055);
  --text: #b8ccdf;
  --text-dim: #4a6070;
  --text-bright: #e2edf8;
  --c-sim:      #64748b;
  --c-safety:   #ef4444;
  --c-found:    #94a3b8;
  --c-control:  #f59e0b;
  --c-loc:      #22c55e;
  --c-nav:      #3b82f6;
  --c-perc:     #a855f7;
  --c-manip:    #f97316;
  --c-mission:  #ec4899;
  --c-sci:      #06b6d4;
  --c-teleop:   #eab308;
  --c-bringup:  #6b7280;
}

*{margin:0;padding:0;box-sizing:border-box;}

::selection { background: rgba(59,130,246,0.35); color: #fff; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* ── BACKGROUND ── */
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(59,130,246,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,.028) 1px, transparent 1px);
  background-size: 48px 48px;
}

.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 35% at 15% 20%, rgba(59,130,246,.06) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 85% 75%, rgba(168,85,247,.05) 0%, transparent 70%),
    radial-gradient(ellipse 50% 25% at 50% 50%, rgba(239,68,68,.03) 0%, transparent 70%);
}

.bg-scan {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.18) 3px, rgba(0,0,0,.18) 4px);
  opacity: .4;
}

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(2,6,9,.92);
  border-bottom: 1px solid rgba(59,130,246,.18);
  backdrop-filter: blur(24px);
  padding: 0 40px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}

.hdr-left { display: flex; align-items: baseline; gap: 20px; }

.hdr-title {
  font-family: 'Orbitron', monospace;
  font-size: 15px; font-weight: 900;
  letter-spacing: 5px; color: #fff;
  text-transform: uppercase;
}

.hdr-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: var(--text-dim);
  letter-spacing: 3px;
}

.hdr-status {
  display: flex; align-items: center; gap: 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; color: #22c55e; letter-spacing: 2px;
}

.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 6px #22c55e;
  animation: blink 2s infinite;
}

@keyframes blink {
  0%,100%{opacity:1} 50%{opacity:.3}
}

.legend {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}

.leg-item {
  display: flex; align-items: center; gap: 5px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; color: var(--text-dim); letter-spacing: 1px;
  cursor: pointer; transition: color .2s;
}

.leg-item:hover { color: var(--text); }

.leg-pip {
  width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0;
}

/* ── MAIN ── */
main {
  position: relative; z-index: 1;
  padding: 36px 40px 80px;
  max-width: 1360px; margin: 0 auto;
}

/* ── LAYER HEADER ── */
.layer-hdr {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 14px; margin-top: 8px;
}

.layer-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing: 3px;
  text-transform: uppercase; white-space: nowrap;
  padding: 3px 10px; border-radius: 2px;
  border: 1px solid;
}

.layer-rule {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,.07), transparent);
}

.layer-desc {
  font-family: 'Rajdhani', sans-serif;
  font-size: 11px; color: var(--text-dim);
  letter-spacing: 1px; white-space: nowrap;
}

/* ── CARD GRID ── */
.cards {
  display: grid; gap: 10px;
  margin-bottom: 0;
}
.cols-1 { grid-template-columns: 1fr; }
.cols-2 { grid-template-columns: 1fr 1fr; }
.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

/* ── CARD ── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-dim);
  border-radius: 5px;
  padding: 18px 20px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
  opacity: 0;
  animation: card-in .5s forwards;
}

@keyframes card-in {
  from { opacity:0; transform: translateY(12px); }
  to   { opacity:1; transform: translateY(0); }
}

.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--cc);
}

.card::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 0% 0%, color-mix(in srgb, var(--cc) 12%, transparent), transparent 65%);
  opacity: 0; transition: opacity .3s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--cc) 50%, transparent);
  box-shadow: 0 10px 40px color-mix(in srgb, var(--cc) 15%, transparent);
}

.card:hover::after { opacity: 1; }

.card.active {
  border-color: var(--cc);
  box-shadow: 0 0 0 1px var(--cc), 0 10px 40px color-mix(in srgb, var(--cc) 20%, transparent);
}

.ci { position: relative; z-index: 1; }

/* card top row */
.ct {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 8px;
  margin-bottom: 11px;
}

.cn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 12.5px; color: var(--cc);
  letter-spacing: .5px; margin-bottom: 2px;
}

.cs {
  font-family: 'Rajdhani', sans-serif;
  font-size: 10px; letter-spacing: 2px;
  color: var(--text-dim); text-transform: uppercase;
  font-weight: 600;
}

.cb {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; padding: 3px 7px;
  border-radius: 2px; letter-spacing: 1px;
  flex-shrink: 0; white-space: nowrap;
  border: 1px solid;
}

.cb-given   { color:#4a6080; border-color:rgba(74,96,128,.4); background:rgba(74,96,128,.1); }
.cb-crit    { color:#ef4444; border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.08);
              animation: crit-pulse 1.8s infinite; }
.cb-build   { color:#3b82f6; border-color:rgba(59,130,246,.4); background:rgba(59,130,246,.08); }
.cb-w1      { color:#22c55e; border-color:rgba(34,197,94,.4); background:rgba(34,197,94,.08); }

@keyframes crit-pulse {
  0%,100%{opacity:1} 50%{opacity:.55}
}

/* WHY row */
.cw-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--cc); opacity: .65; margin-bottom: 3px;
}

.cw-text {
  font-size: 11.5px; line-height: 1.55;
  color: #7a9ab8; font-weight: 400;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* nodes */
.cn-list {
  display: flex; flex-wrap: wrap; gap: 4px;
  margin-top: 10px; margin-bottom: 10px;
}

.nt {
  font-family: 'Share Tech Mono', monospace;
  font-size: 8.5px; padding: 2px 6px;
  background: rgba(255,255,255,.032);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 2px; color: #5a7890; letter-spacing: .3px;
  transition: all .2s;
}

.card:hover .nt {
  background: rgba(255,255,255,.05);
  color: #7a9ab8;
}

/* topics */
.topic-list {
  border-top: 1px solid rgba(255,255,255,.05);
  padding-top: 9px;
  display: flex; flex-direction: column; gap: 3px;
}

.tr {
  display: flex; align-items: center; gap: 7px;
  font-family: 'Share Tech Mono', monospace; font-size: 8.5px;
}

.td { color:var(--text-dim); opacity:.55; flex-shrink:0; width:16px; }
.tn { color:#5a7890; letter-spacing:.3px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tt { color:var(--text-dim); opacity:.35; flex-shrink:0; }

/* owner row */
.co {
  margin-top: 10px;
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 600;
  color: var(--text-dim); letter-spacing: 1px;
}
.co-dot { width:5px; height:5px; border-radius:50%; background:var(--cc); opacity:.5; flex-shrink:0; }

/* click hint */
.chint {
  position: absolute; bottom: 10px; right: 12px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px; color: var(--text-dim); opacity: 0;
  letter-spacing: 2px; transition: opacity .2s;
  pointer-events: none;
}
.card:hover .chint { opacity: .5; }

/* ── FLOW CONNECTOR ── */
.flow {
  display: flex; justify-content: center;
  padding: 6px 0;
  position: relative;
}

.flow-wrap {
  position: relative; width: 2px; height: 38px;
}

.flow-line {
  position: absolute; top:0; left:0; right:0;
  height: 100%;
  background: linear-gradient(180deg, rgba(59,130,246,.25), rgba(59,130,246,.08));
}

.flow-dot {
  position: absolute;
  left: 50%; width: 4px; height: 4px;
  border-radius: 50%; margin-left: -2px;
  background: #3b82f6;
  box-shadow: 0 0 6px #3b82f6, 0 0 12px rgba(59,130,246,.5);
  animation: flow-travel 2.4s linear infinite;
}

.flow-dot:nth-child(2){ animation-delay:.8s; }
.flow-dot:nth-child(3){ animation-delay:1.6s; }

@keyframes flow-travel {
  0%   { top: -4px; opacity:0; }
  8%   { opacity:1; }
  92%  { opacity:1; }
  100% { top: 42px; opacity:0; }
}

.flow-head {
  position: absolute; bottom: -4px; left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 6px; height: 6px;
  border-right: 1px solid rgba(59,130,246,.45);
  border-bottom: 1px solid rgba(59,130,246,.45);
}

/* ── DETAIL PANEL ── */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(6px);
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.overlay.open { opacity:1; pointer-events:all; }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 540px; z-index: 201;
  background: rgba(4,9,18,.97);
  border-left: 1px solid rgba(255,255,255,.07);
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform .35s cubic-bezier(.22,1,.36,1);
}

.panel.open { transform: translateX(0); }

.panel-top {
  position: sticky; top: 0;
  background: rgba(4,9,18,.95);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-dim);
  padding: 22px 28px 18px;
}

.pt-close {
  position: absolute; top: 18px; right: 20px;
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-dim); border-radius: 3px;
  color: var(--text-dim); font-size: 14px;
  cursor: pointer; transition: all .2s;
  font-family: 'Share Tech Mono', monospace;
}
.pt-close:hover { border-color: var(--text); color: var(--text); }

.pt-name {
  font-family: 'Share Tech Mono', monospace;
  font-size: 15px; color: var(--pcc);
  letter-spacing: 1px; margin-bottom: 3px;
}

.pt-type {
  font-size: 10px; letter-spacing: 3px; color: var(--text-dim);
  text-transform: uppercase; font-weight: 600;
  margin-bottom: 6px;
}

.pt-badges { display: flex; gap: 6px; flex-wrap: wrap; }

.pt-badge {
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px; padding: 2px 7px;
  border: 1px solid; border-radius: 2px;
  letter-spacing: 1px;
}

.panel-body { padding: 24px 28px 40px; }

.p-section { margin-bottom: 24px; }

.p-sec-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px; letter-spacing: 4px; text-transform: uppercase;
  color: var(--pcc); opacity: .7;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.p-sec-label::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--pcc) 20%, transparent), transparent);
}

.p-text {
  font-size: 13px; line-height: 1.7;
  color: #7a9ab8; font-weight: 400;
}

.p-nodes {
  display: flex; flex-direction: column; gap: 5px;
}

.p-node {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; padding: 7px 10px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  border-left: 2px solid var(--pcc);
  border-radius: 3px;
  color: #7a9ab8; line-height: 1.5;
}

.p-topic-table {
  width: 100%; border-collapse: collapse;
}

.p-topic-table tr { border-bottom: 1px solid rgba(255,255,255,.04); }
.p-topic-table tr:last-child { border-bottom: none; }

.p-topic-table td {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9.5px; padding: 6px 4px;
  color: #5a7890;
}

.p-topic-table td:first-child { color: var(--text-dim); opacity: .6; width: 20px; }
.p-topic-table td:nth-child(2) { color: #7aabcc; }
.p-topic-table td:last-child { color: var(--text-dim); opacity: .4; text-align:right; }

.p-facts { display: flex; flex-direction: column; gap: 6px; }

.p-fact {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 12px; line-height: 1.55; color: #7a9ab8;
}

.p-fact::before {
  content: '▸';
  color: var(--pcc); opacity: .7;
  flex-shrink: 0; margin-top: 1px;
  font-size: 10px;
}

.p-deps {
  display: flex; flex-wrap: wrap; gap: 5px;
}

.p-dep {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; padding: 3px 8px;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 2px; color: #5a7890;
  background: rgba(255,255,255,.025);
}

.p-week-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: var(--pcc);
  padding: 6px 12px;
  border: 1px solid color-mix(in srgb, var(--pcc) 35%, transparent);
  border-radius: 3px;
  background: color-mix(in srgb, var(--pcc) 8%, transparent);
}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  main{padding:24px 20px 60px;}
  .cols-3{grid-template-columns:1fr 1fr;}
  .cols-2{grid-template-columns:1fr;}
  .panel{width:100%;}
  .legend{display:none;}
}

@media(max-width:600px){
  .cols-3{grid-template-columns:1fr;}
  .hdr-sub{display:none;}
}

/* ── TAB BAR ── */
.tab-bar {
  display: flex; gap: 4px; align-items: center;
}
.tab-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing: 2px;
  padding: 5px 14px; border-radius: 2px;
  border: 1px solid rgba(255,255,255,.08);
  background: transparent; color: var(--text-dim);
  cursor: pointer; transition: all .2s;
  text-transform: uppercase;
}
.tab-btn:hover { color: var(--text); border-color: rgba(255,255,255,.18); }
.tab-btn.active {
  background: rgba(59,130,246,.12);
  border-color: rgba(59,130,246,.4);
  color: #7ab8e8;
}

/* ── FLOW VIEW ── */
#flow-view {
  position: relative; z-index: 1;
  padding: 24px 40px 80px;
}
.flow-title {
  font-family: 'Orbitron', monospace;
  font-size: 11px; letter-spacing: 4px; color: rgba(255,255,255,.25);
  text-transform: uppercase; margin-bottom: 20px;
}
.flow-svg-wrap {
  width: 100%; overflow-x: auto;
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 6px;
  background: rgba(4,8,16,.6);
  backdrop-filter: blur(8px);
}
.flow-svg-wrap svg { display: block; }

/* flow SVG styles */
.fl-lane { opacity: .07; }
.fl-lane-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing: 2.5px;
  text-transform: uppercase; opacity: .5;
}
.fl-node rect {
  rx: 4; ry: 4;
  stroke-width: 1;
  fill: rgba(6,12,24,.9);
  cursor: pointer;
  transition: opacity .2s;
}
.fl-node text {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px; fill: rgba(255,255,255,.75);
  dominant-baseline: middle; text-anchor: middle;
  pointer-events: none;
}
.fl-node .sub-text {
  font-size: 8px; fill: rgba(255,255,255,.35);
}
.fl-node:hover rect { opacity: .8; }
.fl-node.src rect { stroke-dasharray: 4 2; opacity: .6; }
.fl-node.term rect { opacity: .7; }
.fl-node.hub rect { stroke-width: 1.5; }
.fl-node.crit rect { stroke-width: 1.5; }

.fl-edge {
  fill: none; stroke-width: 1.2;
  stroke-dasharray: 6 4;
  marker-end: url(#arrowhead);
}
.fl-edge.crit {
  stroke-width: 1.5;
  stroke-dasharray: 5 3;
}
.fl-edge-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px; fill: rgba(255,255,255,.28);
  text-anchor: middle; dominant-baseline: auto;
  pointer-events: none;
}

@keyframes flowAnim {
  from { stroke-dashoffset: 20; }
  to   { stroke-dashoffset: 0; }
}
@keyframes flowAnimSlow {
  from { stroke-dashoffset: 30; }
  to   { stroke-dashoffset: 0; }
}

/* stagger animations */
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.15s}
.card:nth-child(4){animation-delay:.2s}
.card:nth-child(5){animation-delay:.25s}
.card:nth-child(6){animation-delay:.3s}

/* layer section spacing */
.layer { margin-bottom: 4px; }
.layer + .layer { margin-top: 0; }

/* glow corners */
.card .corner {
  position: absolute;
  width: 6px; height: 6px;
  border-color: var(--cc);
  border-style: solid;
  opacity: 0;
  transition: opacity .3s;
}
.card:hover .corner { opacity: .5; }
.card .corner.tl { top:4px; left:4px; border-width:1px 0 0 1px; }
.card .corner.br { bottom:4px; right:4px; border-width:0 1px 1px 0; }

</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-scan"></div>

<header>
  <div class="hdr-left">
    <h1 class="hdr-title">MARS ROVER</h1>
    <span class="hdr-sub">SOFTWARE ARCHITECTURE v1.0 — DIFF DRIVE / GAZEBO SIM</span>
  </div>
  <div class="legend" id="legend"></div>
  <div style="display:flex;align-items:center;gap:18px;">
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-arch" onclick="showTab('arch')">ARCHITECTURE</button>
      <button class="tab-btn" id="tab-flow" onclick="showTab('flow')">DATA FLOW</button>
    </div>
    <div class="hdr-status">
      <div class="status-dot"></div>
      <span>SIM READY</span>
    </div>
  </div>
</header>

<main id="arch"></main>

<div id="flow-view" style="display:none;">
  <p class="flow-title" style="padding:24px 40px 0;">SYSTEM DATA FLOW — topic paths from sensors to actuators</p>
  <div style="padding:0 40px 80px;">
    <div class="flow-svg-wrap">
      <svg id="flow-svg" viewBox="0 0 1280 780" width="1280" height="780" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
            <polygon points="0 0, 7 2.5, 0 5" fill="rgba(255,255,255,0.28)"/>
          </marker>
          <marker id="arrowhead-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
            <polygon points="0 0, 7 2.5, 0 5" fill="#ef4444"/>
          </marker>
          <marker id="arrowhead-amber" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
            <polygon points="0 0, 7 2.5, 0 5" fill="#f59e0b"/>
          </marker>
          <marker id="arrowhead-blue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
            <polygon points="0 0, 7 2.5, 0 5" fill="#3b82f6"/>
          </marker>
          <marker id="arrowhead-green" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
            <polygon points="0 0, 7 2.5, 0 5" fill="#22c55e"/>
          </marker>
          <filter id="glow-red">

    why:'Without ros2_control, you\'d write your own motor controller, wheel encoder odometry integrator, and velocity command handler — weeks of work, likely buggy. ros2_control provides a production-grade hardware abstraction. In sim it uses GazeboSystem. On real hardware, you swap the plugin for the CAN bus driver — zero changes to navigation code. This is the bridge between ROS velocity commands and physical motion.',

    nodes:['ekf_filter_node_odom — /odom + /imu/filtered → /odometry/filtered (30Hz)','ekf_filter_node_map — /odometry/filtered + /odometry/gps → global pose','navsat_transform_node — /fix/validated + /imu/filtered → /odometry/gps','cartographer_node — /scan + /imu/data + /odom → /map + /tf map→odom','imu_filter_madgwick — /imu/data → /imu/filtered (adds orientation quaternion)','localization_monitor.py — covariance threshold watchdog → /localization/status'],

  rover_perception: {

    why:'Three competition tasks (URC equipment servicing, ARC object retrieval, ERC maintenance) require physical manipulation. The arm must: solve inverse kinematics to reach a target pose, plan a collision-free trajectory, approach without self-collision, grasp with the gripper, and transport. Solving IK and trajectory planning from scratch takes months. MoveIt2 handles this mathematically given a correct URDF and SRDF config.',
    what:'Three nodes building on MoveIt2 Python API. arm_pose_manager provides named pose shortcuts (stow/home/deploy_ready etc.). grasp_planner computes pre-grasp and grasp poses given object position and verifies IK feasibility before committing to a motion. pick_place_server is a 6-phase action server with 30s per-phase timeout and clean failure modes.',

    deps:['rover_perception (/aruco/closest_pose for pick target)','my_robotic_arm (URDF + MoveIt2 SRDF config)'],

  rover_mission: {
    name:'rover_mission', short:'Mission FSM & Autonomy', layer:'mission', color:'#ec4899',
    badge:'BUILD W7', badgeCls:'cb-build', owner:'Aarav Agrawal + Reman Dey', week:'W7-W11',
    why:'Navigation, perception, and manipulation are isolated capabilities. A competition mission is a specific sequence: navigate to GPS waypoint → search for ArUco → pick object → navigate to science site → collect sample → return to base. Without an orchestrator, a human would have to manually trigger each subsystem from the terminal — impossible in competition. The FSM encodes competition-winning sequences and handles every failure mode gracefully.',
    what:'Four nodes. mission_manager.py is the 10-state FSM (IDLE→INIT→NAVIGATING→DETECTING→MANIPULATING→SCIENCE→RECOVERING→RETURNING→COMPLETE→FAULT) with watchdog timers, timeout-based action calls, and mandatory FAULT state requiring human intervention. autonomy_node.py reads mission_config.yaml and selects the task queue for URC/ARC/ERC. spiral_search.py generates Archimedes spiral search patterns. gps_waypoint_converter.py converts competition GPS coords to map frame via UTM.',
    nodes:['mission_manager.py — 10-state FSM, orchestrates all subsystems, FAULT safe-stop','autonomy_node.py — reads mission_config.yaml → task queue per competition mode','spiral_search.py — Archimedes spiral waypoints, stops on aruco/detection received','gps_waypoint_converter.py — lat/lon array → map PoseArray via UTM library'],

    facts:['Build incrementally: W7 (IDLE→NAV→RETURN) → W9 (add DETECTING+MANIPULATING) → W10 (SCIENCE+FAULT)','State watchdog timer: if no FSM transition for >120s → auto-transition to RECOVERING','FAULT state exits ONLY via manual /mission/abort service — human decision, never auto-exit FAULT','All action calls: async + individual timeout (pick_place:60s, science_collect:90s)','competition:=URC|ARC|ERC launch arg selects mission_config.yaml task sequence at startup'],

    name:'rover_science', short:'Science Payload Simulation', layer:'mission', color:'#06b6d4',

    why:'URC, ARC, and ERC all include a soil science task worth up to 25% of total score. The real science payload (drill, spectrometer, pH/moisture/temp sensors) runs on a dedicated RPi CM4 companion computer. During simulation, we need a software substitute so the mission_manager\'s SCIENCE state can be tested and validated end-to-end. The key design decision: ONLY this package gets replaced when real hardware arrives — mission and logger code stays identical.',

  rover_teleop: {
    name:'rover_teleop', short:'Operator Control & E-Stop', layer:'operator', color:'#eab308',

    why:'Operator override is non-negotiable in competition. If the rover heads toward a cliff or another team\'s equipment, the human must stop it instantly. Teleoperation ensures human authority is always highest priority — operator input overrides any autonomous command within 50ms. E-stop is enforced at the velocity gate level (cmd_vel_limiter in rover_safety) so a crashed mission_manager cannot prevent stopping. This package is also built W1 — it\'s the testing tool for all other packages before autonomy exists.',
    what:'Three nodes. keyboard_teleop.py provides manual W/A/S/D control via termios key capture. cmd_vel_mux.py is the priority multiplexer: operator commands win for 0.5s after last keypress, then autonomy takes over transparently. e_stop_node.py publishes zero velocity at 20Hz using its own timer — even if no input arrives — so it cannot be "silently bypassed" by an upstream crash.',

  rover_bringup: {
    name:'rover_bringup', short:'Launch Orchestration', layer:'operator', color:'#6b7280',
    badge:'BUILD W1+', badgeCls:'cb-build', owner:'Reman Dey', week:'W1 (grows weekly)',
    why:'Launching 40+ ROS 2 nodes individually in the correct order with the right parameters is error-prone and slow. Forgetting use_sim_time:=true causes TF timestamp mismatches 30 seconds into a run. A wrong namespace kills all topic connections silently. rover_bringup is the deployment system — it encodes the correct startup order, parameter cascade, frame ID configuration, and failure handling. The whole team uses one command to start the stack.',
    what:'Five launch files that compose subsystems in increasing complexity. sim_nav.launch.py is built W1 (Gazebo + teleop only). Each week, a new launch file or nodes are added. sim_full.launch.py is the final production entry point. Critical nodes use on_exit=Shutdown() so any crash causes a clean full shutdown rather than a zombie state with missing nodes and silent failures.',

function renderArch(){
  const arch = document.getElementById('arch');
  let delay = 0;

  LAYERS.forEach((layer, li) => {
    // layer header
    const hdr = document.createElement('div');
    hdr.className = 'layer-hdr';
    hdr.innerHTML = `
      <span class="layer-tag" style="color:${layer.color};border-color:${layer.color}33;background:${layer.color}11">
        ${layer.label}
      </span>
      <div class="layer-rule" style="background:linear-gradient(90deg,${layer.color}22,transparent)"></div>
      <span class="layer-desc">${layer.desc}</span>
    `;
    arch.appendChild(hdr);

    // cards grid
    const grid = document.createElement('div');
    grid.className = `cards ${layer.cols} layer`;

    layer.pkgs.forEach(pid => {
      const p = PKG[pid];
      const card = document.createElement('div');
      card.className = 'card';
      card.style.cssText = `--cc:${p.color}; animation-delay:${delay}s`;
      card.dataset.pkg = pid;

      const shortTopics = [...(p.pubs||[]).slice(0,3),...(p.subs||[]).slice(0,2)];
      const topicRows = shortTopics.map(t => {
        const isPub = p.pubs.includes(t);
        return `<div class="tr">
          <span class="td">${isPub?'↑':'↓'}</span>
          <span class="tn">${t[0]}</span>
          <span class="tt">${t[1]}</span>
        </div>`;
      }).join('');

      const nodesSample = (p.nodes||[]).slice(0,3).map(n=>
        `<span class="nt">${n.split(' ')[0]}</span>`
      ).join('');

      card.innerHTML = `
        <div class="corner tl"></div>
        <div class="corner br"></div>
        <div class="ci">
          <div class="ct">
            <div>
              <div class="cn">${p.name}</div>
              <div class="cs">${p.short}</div>
            </div>
            <span class="cb ${p.badgeCls}">${p.badge}</span>
          </div>
          <div class="cw-label">WHY</div>
          <p class="cw-text">${p.why}</p>
          <div class="cn-list">${nodesSample}</div>
          <div class="topic-list">${topicRows}</div>
          <div class="co">
            <div class="co-dot"></div>
            ${p.owner}
            ${p.week ? `· <span style="color:${p.color};opacity:.7;font-family:'Share Tech Mono',monospace;font-size:9px">${p.week}</span>` : ''}
          </div>
        </div>
        <span class="chint">CLICK FOR DETAIL →</span>
      `;

      card.addEventListener('click', () => openPanel(pid));
      grid.appendChild(card);
      delay += 0.06;
    });

    arch.appendChild(grid);

    // flow connector (not after last layer)
    if(li < LAYERS.length - 1){
      const flow = document.createElement('div');
      flow.className = 'flow';
      flow.innerHTML = `
        <div class="flow-wrap">
          <div class="flow-line"></div>
          <div class="flow-dot"></div>
          <div class="flow-dot"></div>
          <div class="flow-dot"></div>
          <div class="flow-head"></div>
        </div>
      `;
      arch.appendChild(flow);
    }
  });
}

  document.documentElement.style.setProperty('--pcc', p.color);

  document.getElementById('pt-name').textContent = p.name;

    <span class="pt-badge ${p.badgeCls}" style="color:${p.color};border-color:${p.color}55;background:${p.color}11">${p.badge}</span>
    ${p.week ? `<span class="pt-badge" style="color:#3b82f6;border-color:#3b82f655;background:#3b82f611">BUILD ${p.week}</span>` : ''}
    ${p.owner !== 'Seniors' && p.owner !== '— Environment' ? `<span class="pt-badge" style="color:#94a3b8;border-color:#94a3b833;background:#94a3b811">OWNER: ${p.owner}</span>` : ''}

  let body = '';

  // WHY
  body += `
    <div class="p-section">
      <div class="p-sec-label">WHY WE NEED THIS</div>
      <p class="p-text">${p.why}</p>
    </div>
  `;

  // WHAT
  body += `
    <div class="p-section">
      <div class="p-sec-label">WHAT IT DOES</div>
      <p class="p-text">${p.what}</p>
    </div>
  `;

  // NODES
  if(p.nodes && p.nodes.length){
    body += `
      <div class="p-section">
        <div class="p-sec-label">NODES / COMPONENTS</div>
        <div class="p-nodes">
          ${p.nodes.map(n=>`<div class="p-node">${n}</div>`).join('')}
        </div>
      </div>
    `;
  }

  // INTERFACES
  const hasPubs = p.pubs && p.pubs.length;
  const hasSubs = p.subs && p.subs.length;
  if(hasPubs || hasSubs){
    body += `
      <div class="p-section">
        <div class="p-sec-label">ROS 2 INTERFACES</div>
        <table class="p-topic-table">
          ${hasPubs ? p.pubs.map(t=>`
            <tr>
              <td>↑</td>
              <td style="color:#7aabcc">${t[0]}</td>
              <td style="color:#5a7890">${t[1]}</td>
              <td>${t[2]||''}</td>
            </tr>
          `).join('') : ''}
          ${hasSubs ? p.subs.map(t=>`
            <tr>
              <td style="opacity:.4">↓</td>
              <td>${t[0]}</td>
              <td>${t[1]}</td>
              <td>${t[2]||''}</td>
            </tr>
          `).join('') : ''}
        </table>
      </div>
    `;
  }

  // FACTS
  if(p.facts && p.facts.length){
    body += `
      <div class="p-section">
        <div class="p-sec-label">KEY IMPLEMENTATION DETAILS</div>
        <div class="p-facts">
          ${p.facts.map(f=>`<div class="p-fact">${f}</div>`).join('')}
        </div>
      </div>
    `;
  }

  // DEPS + USES
  body += `
    <div class="p-section">
      <div class="p-sec-label">DEPENDS ON</div>
      <div class="p-deps">
        ${(p.deps&&p.deps.length) ? p.deps.map(d=>`<span class="p-dep">${d}</span>`).join('') : '<span class="p-dep">none</span>'}
      </div>
    </div>
    <div class="p-section">
      <div class="p-sec-label">USED BY</div>
      <div class="p-deps">
        ${(p.uses&&p.uses.length) ? p.uses.map(d=>`<span class="p-dep" style="border-color:${p.color}33;color:${p.color};opacity:.8">${d}</span>`).join('') : '<span class="p-dep">—</span>'}

  if(p.messages || p.actions || p.services){
    body += `<div class="p-section"><div class="p-sec-label">DEFINED TYPES</div><div class="p-facts">`;

    if(p.services) body += `<div class="p-fact">Services: ${p.services.join(', ')}</div>`;
    body += `</div></div>`;
  }

  document.getElementById('panel-body').innerHTML = body;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
  document.getElementById('panel').scrollTop = 0;
}

function closePanel(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');

/* ══════════════════════════════════════════════════════════
   FLOW DIAGRAM
══════════════════════════════════════════════════════════ */
function renderFlow(){
  const svg = document.getElementById('flow-svg');
  const NS = 'http://www.w3.org/2000/svg';

  // ── helpers ──────────────────────────────────────────
  function el(tag, attrs, txt){
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));
    if(txt!=null) e.textContent = txt;
    return e;
  }
  function g(cls){ return el('g',{class:cls}); }

  // node box: x,y = CENTER coords
  function drawNode(n){
    const w = n.w||130; const h = n.h||34;
    const gr = g('fl-node'+(n.src?' src':'')+(n.term?' term':'')+(n.hub?' hub':'')+(n.crit?' crit':''));
    gr.setAttribute('data-nid', n.id);
    const r = el('rect',{
      x: n.x - w/2, y: n.y - h/2, width:w, height:h,
      rx:4, ry:4,
      fill: 'rgba(6,12,24,.92)',
      stroke: n.color,
      'stroke-opacity': n.crit ? '0.7' : '0.4',
      'stroke-width': n.hub||n.crit ? '1.5' : '1',
    });
    gr.appendChild(r);
    // top color bar
    const bar = el('rect',{
      x: n.x - w/2 + 4, y: n.y - h/2,
      width: w-8, height: 2,
      fill: n.color, opacity: '0.7', rx:1,
    });
    gr.appendChild(bar);
    // label (split on \n)
    const lines = n.label.split('\n');
    if(lines.length === 1){
      gr.appendChild(el('text',{ x:n.x, y:n.y,
        'font-family':"'Share Tech Mono',monospace",
        'font-size': n.hub ? '10' : '9.5',
        fill: n.src ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.78)',
        'dominant-baseline':'middle','text-anchor':'middle',
        'pointer-events':'none',
      }, n.label));
    } else {
      lines.forEach((ln,i)=>{
        const dy = (i - (lines.length-1)/2) * 13;
        gr.appendChild(el('text',{ x:n.x, y:n.y+dy,
          'font-family':"'Share Tech Mono',monospace", 'font-size':'10',
          fill:'rgba(255,255,255,0.78)',
          'dominant-baseline':'middle','text-anchor':'middle',
          'pointer-events':'none',
        }, ln));
      });
    }
    svg.appendChild(gr);
  }

  // edge path between two nodes
  function edgePath(fn, tn){
    const fw=fn.w||130, fh=fn.h||34;
    const tw=tn.w||130, th=tn.h||34;
    const dx = tn.x - fn.x, dy = tn.y - fn.y;
    let sx,sy,ex,ey;
    if(Math.abs(dx)>=Math.abs(dy)){
      if(dx>0){ sx=fn.x+fw/2; sy=fn.y; ex=tn.x-tw/2; ey=tn.y; }
      else     { sx=fn.x-fw/2; sy=fn.y; ex=tn.x+tw/2; ey=tn.y; }
    } else {
      if(dy>0){ sx=fn.x; sy=fn.y+fh/2; ex=tn.x; ey=tn.y-th/2; }
      else     { sx=fn.x; sy=fn.y-fh/2; ex=tn.x; ey=tn.y+th/2; }
    }
    const c1x=sx+(ex-sx)*0.45, c2x=ex-(ex-sx)*0.45;
    return { d:`M${sx},${sy} C${c1x},${sy} ${c2x},${ey} ${ex},${ey}`,
             mx:(sx+ex)/2, my:(sy+ey)/2 };
  }

  function drawEdge(e, nodes){
    const fn=nodes[e.from], tn=nodes[e.to];
    if(!fn||!tn) return;
    const p = edgePath(fn,tn);
    const stroke = e.color || fn.color || 'rgba(255,255,255,0.2)';
    const markerMap = {
      '#ef4444':'url(#arrowhead-red)',
      '#f59e0b':'url(#arrowhead-amber)',
      '#3b82f6':'url(#arrowhead-blue)',
      '#22c55e':'url(#arrowhead-green)',
    };
    const marker = markerMap[stroke] || 'url(#arrowhead)';
    const path = el('path',{
      d: p.d,
      stroke, 'stroke-opacity': e.crit ? '0.8' : '0.35',
      'stroke-width': e.crit ? '1.5':'1.1',
      'stroke-dasharray': '6 4', fill:'none',
      'marker-end': marker,
    });
    // animate
    const dur = e.crit ? '1.2s' : '1.8s';
    const delay = (Math.random()*1.2).toFixed(2)+'s';
    path.style.animation = `flowAnim ${dur} linear ${delay} infinite`;
    svg.appendChild(path);

    if(e.label){
      const lbl = el('text',{
        x: p.mx, y: p.my - 6,
        'font-family':"'Share Tech Mono',monospace", 'font-size':'7.5',
        fill: 'rgba(255,255,255,0.28)', 'text-anchor':'middle',
      }, e.label);
      svg.appendChild(lbl);
    }
  }

  // lane background
  function drawLane(lane){
    const r = el('rect',{
      x:16, y:lane.y, width:1248, height:lane.h,
      rx:6, fill:lane.color, opacity:'0.06',
      stroke:lane.color, 'stroke-opacity':'0.15', 'stroke-width':'1',
    });
    svg.appendChild(r);
    svg.appendChild(el('text',{
      x:28, y:lane.y+15,
      'font-family':"'Share Tech Mono',monospace", 'font-size':'8',
      fill:lane.color, opacity:'0.55', 'letter-spacing':'2',

  }

  // ── DATA ─────────────────────────────────────────────
  const LANES = [
    { label:'01 · CONTROL CHAIN — /cmd_vel path from operator to wheels', color:'#f59e0b', y:20,  h:125 },

    { from:'mission',   to:'wp_nav',    label:'/mission/waypoints', color:'#ec4899' },
    { from:'wp_nav',    to:'nav2_m',    label:'NavigateToPose', color:'#3b82f6' },
    { from:'recovery',  to:'wp_nav',    label:'recovery cmds', color:'#3b82f6' },
    { from:'aruco',     to:'mission',   label:'/aruco/closest_pose', color:'#a855f7' },
    { from:'obj_det',   to:'mission',   label:'/detections',   color:'#a855f7' },
    { from:'mission',   to:'spiral',    label:'/spiral_search/start', color:'#ec4899' },
    { from:'spiral',    to:'wp_nav',    label:'waypoints',     color:'#ec4899' },
    { from:'mission',   to:'pick_place',label:'PickPlace action', color:'#f97316' },
    { from:'pick_place',to:'arm',       label:'MoveGroup',     color:'#f97316' },
    { from:'mission',   to:'science',   label:'ScienceCollect',color:'#06b6d4' },
    { from:'watchdog',  to:'mission',   label:'/safety/critical_failure', color:'#ef4444', crit:true },
  ];

  // ── RENDER ────────────────────────────────────────────
  LANES.forEach(drawLane);
  EDGES.forEach(e => drawEdge(e, N));
  Object.values(N).forEach(drawNode);

  // topic legend strip
  const ledge = [
    ['OPERATOR INPUT','#eab308'],['SAFETY / E-STOP','#ef4444'],
    ['SENSOR DATA','#22c55e'],['NAVIGATION','#3b82f6'],
    ['PERCEPTION','#a855f7'],['MANIPULATION','#f97316'],
    ['SCIENCE','#06b6d4'],['MISSION FSM','#ec4899'],
  ];
  const lx0 = 24, ly = 760;
  let lxOff = lx0;
  ledge.forEach(([lbl,col])=>{
    const gr = el('g',{});
    gr.appendChild(el('rect',{x:lxOff, y:ly, width:8, height:8, rx:1, fill:col, opacity:'0.7'}));
    gr.appendChild(el('text',{
      x:lxOff+12, y:ly+4,
      'font-family':"'Share Tech Mono',monospace", 'font-size':'8',
      fill:'rgba(255,255,255,0.4)', 'dominant-baseline':'middle',
    }, lbl));
    svg.appendChild(gr);
    lxOff += lbl.length*5.5 + 28;
  });
}

/* ══════════════════════════════════════════════════════════
   LEGEND
══════════════════════════════════════════════════════════ */
function renderLegend(){
  const el = document.getElementById('legend');
  const items = [
    ['SIM','#64748b'],['SAFETY','#ef4444'],['FOUNDATION','#94a3b8'],
    ['NAVIGATION','#3b82f6'],['PERCEPTION','#a855f7'],['MANIPULATION','#f97316'],
    ['MISSION','#ec4899'],['SCIENCE','#06b6d4'],['OPERATOR','#eab308'],
  ];
  el.innerHTML = items.map(([l,c])=>`
    <div class="leg-item">
      <div class="leg-pip" style="background:${c}"></div>
      ${l}
    </div>
  `).join('');
}

/* ══════════════════════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closePanel();
});

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
renderLegend();
renderArch();
</script>
