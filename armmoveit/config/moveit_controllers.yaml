moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - z_axis
      - link_1
      - link_2
      - link_3
      - wrist_1
      - gripper-wrist

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      
      - claw1-slide
      - claw2-slide
      - finger1-rotate
      - finger2-rotate